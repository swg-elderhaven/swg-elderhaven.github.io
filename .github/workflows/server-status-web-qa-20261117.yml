name: Preview shared server status with bounded synthetic responses
'on':
  push:
    branches:
    - server-status-20261117
    paths:
    - .github/workflows/server-status-web-qa-20261117.yml
    - assets/app.js
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Materialize exact current-site preview and status tests
      shell: python
      run: 'import pathlib,json,base64,zlib

        r=pathlib.Path(''webqa'');r.mkdir()

        for n,b in json.loads(zlib.decompress(base64.b64decode(''''))).items():(r/n).write_bytes(base64.b64decode(b))

        '
    - name: Install pinned browser automation package
      working-directory: webqa
      run: npm install --no-save playwright@1.62.1
    - name: Locate preinstalled hosted browser
      shell: python
      run: 'import os,shutil

        p=shutil.which(''google-chrome'')or shutil.which(''chromium'')

        assert p,''Hosted browser unavailable''

        with open(os.environ[''GITHUB_ENV''],''a'')as f:f.write(''EH_TEST_CHROMIUM=''+p+''\n'')

        '
    - name: Exercise real website UI with online, offline, stale, malformed, oversized and failed replies
      working-directory: webqa
      run: 'node --test status-core.test.mjs

        node test-website.cjs'
    - name: Emit small verified website header preview
      shell: python
      run: 'import pathlib,base64

        p=pathlib.Path(''webqa/website-status-online.png'');assert p.stat().st_size<100000

        print(''WEBSITE_STATUS_PNG ''+base64.b64encode(p.read_bytes()).decode())

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: elder-haven-status-website-preview
        path: 'webqa/website-status-*.png

          webqa/website-tests.json'
        retention-days: 10
